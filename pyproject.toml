[project]
name = "dantec-optimade-federation"
version = "0.1.0"
description = "OPTIMADE federation layer for DANTEc and NOMAD unified search"
requires-python = ">=3.11"
dependencies = [
    "optimade[client,http-client]",
    "requests",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dantec_optimade"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
